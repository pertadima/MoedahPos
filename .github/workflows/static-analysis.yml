name: Static Analysis

on:
  push:
    branches: [main, "feature/**", "fix/**", "enchancement/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: golangci-lint ──────────────────────────────────────────────────
  backend-lint:
    name: Backend (Go) — golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend
          args: --timeout=5m
          skip-cache: false

  # ── Backend: Build check ────────────────────────────────────────────────────
  backend-build:
    name: Backend (Go) — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build
        run: cd backend && go build ./...

  # ── Backend: Tests & Coverage ───────────────────────────────────────────────
  backend-test:
    name: Backend (Go) — Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests with coverage
        run: |
          cd backend
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Generate Coverage Report
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: backend/coverage.out
          local-prefix: github.com/moedahpos/backend
          git-token: ${{ github.token }}
          git-branch: ${{ github.head_ref || github.ref_name }}

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.html

  # ── Frontend: TypeScript ────────────────────────────────────────────────────
  frontend-type-check:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run type-check

  # ── Frontend: ESLint ────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

  # ── Frontend: Prettier ──────────────────────────────────────────────────────
  frontend-format:
    name: Frontend — Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Check formatting
        run: cd frontend && npm run format:check
